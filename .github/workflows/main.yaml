name: "Main Workflow"

# Trigger point for the workflow - pull request to the dev branch
on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: "Node project build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v2

      - name: "Set up Node.js"
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: "Install dependencies"
        run: npm install

      - name: "Run tests"
        run: npm test
      
